name: Sync Garmin to Notion

on:
  schedule:
    - cron: '0 10 * * *' # Dagelijks om 10.00 uur Belgische tijd
      timezone: 'Europe/Brussels'

  workflow_dispatch:
    inputs:
      GARMIN_ACTIVITIES_FETCH_LIMIT:
        type: number
        default: 10
      GARMIN_SLEEP_DAYS_BACK:
        description: Number of sleep dates to check and backfill
        type: number
        default: 500
      GARMIN_STEPS_DAYS_BACK:
        description: Number of daily-steps dates to check and backfill
        type: number
        default: 500

env:
  TZ: 'Europe/Brussels'
  GARMIN_TOKENSTORE_DIR: .garmin_tokenstore
  # Zorgt dat print() en tracebacks in de juiste volgorde in het log komen.
  PYTHONUNBUFFERED: '1'

concurrency:
  group: garmin-to-notion
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Een normale run duurt 1-2 minuten; dit voorkomt dat een vastgelopen run
    # tot de GitHub-standaard van 6 uur blijft draaien.
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --upgrade-package garminconnect

      # De Garmin-sessie wordt tijdens de run ververst/vernieuwd. Die
      # vernieuwde sessie hier cachen zorgt dat de volgende run daarmee
      # verdergaat, in plaats van steeds hetzelfde (mogelijk verlopen) token
      # uit GARMIN_AUTH_TOKEN opnieuw te proberen. Bij een cache-miss (eerste
      # run, of cache verlopen na >7 dagen zonder run) valt het script terug
      # op GARMIN_AUTH_TOKEN om de cache opnieuw te vullen.
      - name: Restore cached Garmin session
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.GARMIN_TOKENSTORE_DIR }}
          key: garmin-tokenstore-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            garmin-tokenstore-

      - name: Run script
        env:
          GARMIN_AUTH_TOKEN: ${{ secrets.GARMIN_AUTH_TOKEN }}
          # Optioneel: alleen als je deze secrets zelf hebt toegevoegd. Zonder
          # geeft het script gewoon de oude 401-fout als de sessie ooit
          # volledig ongeldig wordt gemaakt door Garmin, en moet je opnieuw
          # eenmalig een token genereren (zie README_AUTH_SETUP.md).
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          NOTION_PR_DB_ID: ${{ secrets.NOTION_PR_DB_ID }}
          NOTION_STEPS_DB_ID: ${{ secrets.NOTION_STEPS_DB_ID }}
          NOTION_SLEEP_DB_ID: ${{ secrets.NOTION_SLEEP_DB_ID }}
          GARMIN_ACTIVITIES_FETCH_LIMIT: ${{ inputs.GARMIN_ACTIVITIES_FETCH_LIMIT || '10' }}
          GARMIN_SLEEP_DAYS_BACK: ${{ inputs.GARMIN_SLEEP_DAYS_BACK || '30' }}
          # Dagelijks volstaan de laatste 30 dagen; een volledige backfill
          # (500 dagen) kan handmatig via "Run workflow".
          GARMIN_STEPS_DAYS_BACK: ${{ inputs.GARMIN_STEPS_DAYS_BACK || '30' }}
          TZ: 'Europe/Brussels'

        run: |
          uv run python -m src.workflows.garmin-activities
          uv run python -m src.workflows.personal-records
          uv run python -m src.workflows.daily-steps
          uv run python -m src.workflows.sleep-data

      # Altijd opslaan, ook als een van de scripts hierboven faalt: zo gaat
      # een sessie die halverwege al ververst was niet verloren.
      - name: Save refreshed Garmin session
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.GARMIN_TOKENSTORE_DIR }}
          key: garmin-tokenstore-${{ github.run_id }}-${{ github.run_attempt }}
